# recipe for one turboswan experiment, copy and rename it for a new one

[data]
# a folder that already contains the data
source = "~/turboswan/data/demo"
train_subdir = "train_data"
val_subdir = "val_data"
min_max_file = "min_max_files/min-max-values-all.nc" # normalization values
valid_mask_file = "valid-mask.npy"
max_tfrecords = 2 # remove to use every data file
# variable names must match the tfrecords and normalization file
input_variables = ["xwnd", "ywnd", "wl"]
output_variables = ["hs"]
boundary_variables = ["hs_bnd", "tp_bnd", "theta0_bnd"]
indices = [3]
shuffle_buffer_size = 8 # small on purpose so it fits jupyterhub 2gb memory limit
seed = 0

[augmentation]
# enable only if the transform preserves the physics of your data
flip_horizontal = false
flip_vertical = false
rotate_180 = false

[model]
# small demo network, full runs use widths = [16, 32, 64, 128, 256, 256] and block_depth = 3
widths = [4, 8, 8, 8, 8, 8]
block_depth = 1
kernel_size = 5
dropout = true

[training]
# demo values finish quickly, not a training recommendation
learning_rate = 1e-4
lr_decay_steps = 10000
lr_decay_rate = 0.9
n_epochs = 3
batch_size = 2
steps_per_epoch = 3 # omit to iterate the full split each epoch
validation_steps = 1 # omit to iterate the full validation split
steps_per_execution = 1 # batches per keras execution
verbose = 2 # keras verbosity

[run]
# local = MLflow records stay on this machine (~/turboswan/mlflow unless
# mlflow.local_tracking_dir is set); dnai = platform MLflow
mode = "local"
# outputs go to model_dir/model_version
model_dir = "~/turboswan/trained_models"
model_version = "turbo_swan_demo"
tensorboard = false
histogram_freq = 1 # tensorboard histogram interval in epochs
# these 2 options are interesting for non-mlflow runs, mlflow logs models and metrics itself
checkpoint = false # save checkpoints during training
save_final = false # save the final model after training

[mlflow]
# only used by turboswan.training_mlflow and turboswan.training_sweep
experiment_name = "turboswan/demo"

# Labels describe logged values; they do not change training or sweep selection.
# Unlisted metrics keep their names. Parameter labels and variable descriptions
# default to turboswan/mlops/tracking/default_labels.toml; add [mlflow.parameter_labels] or
# [mlflow.variable_descriptions] only to override.
[mlflow.metric_labels]
loss = "Training masked MSE - normalised wave height"
val_loss = "Validation masked MSE - normalised wave height"

# Optional plots for tracked training and sweeps; use data on the training grid.
# The first example in the first sorted shard is plotted, not the full dataset.
# [[comparisons]]
# name = "My chosen SWAN comparison"
# subdir = "my-comparison" # folder inside data.source
# plots = ["Error map"]
