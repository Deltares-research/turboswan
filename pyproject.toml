[project]
name = "turboswan"
version = "0.1.1"
description = "TurboSWAN training, experiment tracking, and sweep workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deltares-ai-platform-sdk",
    "keras-tuner>=1.4.8",
    "matplotlib>=3.11.1",
    "mlflow==3.15.1",
    "netcdf4>=1.7.4",
    "optuna>=4.0",
    "pandas>=2.0.3,<3",
    "psutil>=6.0",
    "pydantic>=2.0",
    "seaborn>=0.13.2",
    "tensorflow>=2.21.0",
    "xarray>=2026.7.0",
    "ray==2.56.1",
    "pytest>=9.1.1",
    "ipykernel",
]

[project.optional-dependencies]
gpu = [
    "tensorflow[and-cuda]>=2.21.0; sys_platform == 'linux'",
]

[[tool.uv.index]]
name = "python-internal"
url = "https://internal-artifacts.deltares.nl/repository/python-internal/simple/"
authenticate = "always"
default = true

[tool.uv]
environments = [
    "python_version == '3.12' and (sys_platform != 'win32' or platform_machine != 'ARM64')",
]

[tool.uv.sources]
# needs to be on nexus, see MLPS-245
deltares-ai-platform-sdk = { path = "deltares_ai_platform_sdk", editable = true }

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "turboswan"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not e2e and not developer'"
markers = [
    "e2e: runs real training on local data; opt in with `pytest -m e2e`",
    "developer: builds a new environment from the README steps and runs the demo notebooks; opt in with `pytest -m developer`",
]

[tool.ruff]
required-version = "==0.14.0"
target-version = "py312"
force-exclude = true
extend-exclude = ["notebooks/demo_dnai_notes.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E731"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "../.."
venv = ".venv"

[tool.coverage.run]
branch = true
source = ["turboswan"]
data_file = "projects/turboswan/.coverage"

[tool.coverage.report]
show_missing = true

[tool.coverage.html]
directory = "projects/turboswan/htmlcov"

[tool.coverage.xml]
output = "projects/turboswan/coverage.xml"
